# Werkt de gamedatabase bij: haalt alle Nintendo-games uit IGDB, schrijft public/data/games.json (+ games-meta.json)
# en commit dat naar main. Netlify deployt daarna vanzelf; de app ziet de nieuwe versie via /data/games-meta.json.
# Draait de 1e en 22e van elke maand (± elke 3 weken), via de knop "Nu bijwerken" in de app, en na een push
# die de manier van ophalen/filteren verandert.
#
# Secrets (GitHub > Settings > Secrets and variables > Actions):
#   TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET  - IGDB (zelfde als in je lokale .env)
name: Gamedata bijwerken

on:
  schedule:
    - cron: '0 4 1,22 * *' # de 1e en 22e van de maand, 04:00 UTC
  workflow_dispatch: # handmatig: knop in de app (via /api/refresh) of in GitHub > Actions
  push: # meteen opnieuw bouwen als de manier van ophalen/filteren verandert
    branches: [main]
    paths:
      - scripts/build-data.mjs
      - netlify/lib/igdb.mjs

permissions:
  contents: write # om de nieuwe data te committen

concurrency:
  group: data-commit # niet tegelijk met de speeltijden-workflow committen
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: IGDB ophalen
        run: node scripts/build-data.mjs
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - name: Committen als er iets veranderd is
        run: |
          if git diff --quiet -- public/data/games.json; then echo "Geen nieuwe games"; exit 0; fi
          git config user.name "gamedata-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/games.json public/data/games-meta.json
          git commit -m "Gamedata bijgewerkt ($(node -p "require('./public/data/games-meta.json').count") games)"
          git pull --rebase origin main
          git push origin HEAD:main
