# Haalt eens per maand de speeltijden op bij HowLongToBeat (voor de bekendere games), schrijft
# public/data/hltb.json en commit dat naar main (Netlify deployt dan vanzelf).
# Duurt een paar uur, omdat het rustig aan doet (1 zoekopdracht per seconde). Geen secrets nodig.
name: Speeltijden bijwerken (HowLongToBeat)

on:
  schedule:
    - cron: '0 2 3 * *' # de 3e van elke maand, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: HowLongToBeat ophalen
        run: node scripts/build-hltb.mjs
      - name: Committen als er iets veranderd is
        run: |
          if git diff --quiet -- public/data/hltb.json; then echo "Geen wijzigingen"; exit 0; fi
          git config user.name "gamedata-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/hltb.json
          git commit -m "Speeltijden bijgewerkt (HowLongToBeat)"
          git pull --rebase origin main
          git push origin HEAD:main
