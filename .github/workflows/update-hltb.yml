# Speeltijden van HowLongToBeat bijwerken en public/data/hltb.json committen naar main als er iets veranderd is.
# Normaal alleen games die nog nooit gezocht zijn + releases van het afgelopen jaar (een paar minuten); twee keer
# per jaar vanzelf alles opnieuw (een paar uur, 1 zoekopdracht per seconde). Geen secrets nodig.
name: Speeltijden bijwerken (HowLongToBeat)

on:
  schedule:
    - cron: '0 2 3 * *' # de 3e van elke maand, 02:00 UTC
  workflow_dispatch:
    inputs:
      full:
        description: 'Alles opnieuw ophalen (een paar uur)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: HowLongToBeat ophalen
        run: node scripts/build-hltb.mjs ${{ inputs.full && '--full' || '' }}
      - name: Committen als er iets veranderd is
        run: |
          if git diff --quiet -- public/data/hltb.json; then echo "Geen wijzigingen"; exit 0; fi
          git config user.name "gamedata-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/hltb.json
          git commit -m "Speeltijden bijgewerkt (HowLongToBeat)"
          git pull --rebase origin main
          git push origin HEAD:main
